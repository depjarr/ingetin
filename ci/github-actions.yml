name: CI

on:
  push:
  pull_request:

jobs:
  web-vue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-vue
    env:
      # Nilai palsu, hanya supaya build tidak gagal di CI
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-dummy
      VITE_VAPID_PUBLIC_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-vue/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/send-reminders/index.ts supabase/functions/chat/index.ts
      - run: deno test supabase/functions/chat/
